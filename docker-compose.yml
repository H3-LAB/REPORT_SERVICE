# REPORT SERVICE: base de dados, web e scheduler (um só: é ele que envia os reports agendados).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: report_service
      POSTGRES_USER: report_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - report-service-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_service -d report_service"]
      interval: 10s
      retries: 6

  web:
    image: ghcr.io/h3-lab/report-service:${REPORT_SERVICE_VERSION:-1.1.0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://report_service:${POSTGRES_PASSWORD}@db:5432/report_service
    ports:
      - "${REPORT_SERVICE_PORT:-8090}:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: ghcr.io/h3-lab/report-service:${REPORT_SERVICE_VERSION:-1.1.0}
    restart: unless-stopped
    command: ["python", "scheduler.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://report_service:${POSTGRES_PASSWORD}@db:5432/report_service
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  report-service-db:
