# REPORT SERVICE: base de dados, web e scheduler (um só: é ele que envia os reports agendados).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: report_service
      POSTGRES_USER: report_service
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - report-service-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_service -d report_service"]
      interval: 10s
      retries: 6

  web:
    image: ghcr.io/h3-lab/report-service:${REPORT_SERVICE_VERSION:-1.1.5}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://report_service:${POSTGRES_PASSWORD}@db:5432/report_service
    ports:
      - "${REPORT_SERVICE_PORT:-8090}:8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: ghcr.io/h3-lab/report-service:${REPORT_SERVICE_VERSION:-1.1.5}
    restart: unless-stopped
    command: ["python", "scheduler.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://report_service:${POSTGRES_PASSWORD}@db:5432/report_service
    depends_on:
      db:
        condition: service_healthy

  # Porta só para os agentes, com HTTPS e sem passar pelo nginx: só responde à API dos agentes.
  # Precisa de certs/server.crt e certs/server.key (ver README).
  agent-api:
    image: ghcr.io/h3-lab/report-service:${REPORT_SERVICE_VERSION:-1.1.5}
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:10050", "--certfile", "/certs/server.crt", "--keyfile", "/certs/server.key",
              "--workers", "2", "--timeout", "300", "--access-logfile", "-", "app:app"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://report_service:${POSTGRES_PASSWORD}@db:5432/report_service
      AGENT_API_ONLY: "1"
      # A API dos agentes fica na raiz desta porta, mesmo que a interface tenha prefixo atrás do nginx
      URL_PREFIX: ""
    ports:
      - "${AGENT_API_PORT:-10050}:10050"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  report-service-db:
